[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["Conrad Taylor <conradwt@gmail.com>"]
license = "MIT"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
axum = "0.8.9"
buffa = "0.9.2"
connectrpc = { version = "0.9.1", features = ["axum", "client", "server"] }
futures = "0.3.34"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
